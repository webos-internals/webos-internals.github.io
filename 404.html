<title>Page not found — webOS Internals</title>
<script>
// Old site served the wiki from this domain. Send /wiki/* to the wiki, keeping the path.
(function(){
  var p = location.pathname;
  if (p.indexOf('/wiki/') === 0 || p.indexOf('/index.php') === 0 || p.indexOf('/w/') === 0) {
    location.replace('https://wiki.webos-internals.org' + p + location.search + location.hash);
  }
})();
</script>
